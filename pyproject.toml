[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmy"
version = "0.1.0"
description = "AI research harness for restricted-shell escape research: a capability-graph agent that composes verified primitives against disposable lab targets."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "pexpect>=4.9",
    "pyte>=0.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
watch = ["textual>=0.80"]

[project.scripts]
jimmy = "jimmy.cli:main"

[tool.setuptools.packages.find]
include = ["jimmy*"]

[tool.setuptools.package-data]
jimmy = ["lab/*.py"]
